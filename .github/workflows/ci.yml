name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_publish_docs.py
      - name: Validate user guide
        run: python3 scripts/publish-docs.py --destination "$RUNNER_TEMP/docs-validation" --version 0.0.0-test --commit "$GITHUB_SHA"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Format check
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' \
            -not -path './web/*' \
            -not -path './.gocache/*' \
            -not -path './vendor/*' \
            -not -path '*/node_modules/*'))
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Build daemon and yggctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          mkdir -p bin
          go build -o "bin/yggdrasil-daemon${ext}" ./cmd/daemon
          go build -o "bin/yggctl${ext}" ./cmd/devctl

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm exec tsc -b --pretty false
      - run: pnpm test
      - run: pnpm build
