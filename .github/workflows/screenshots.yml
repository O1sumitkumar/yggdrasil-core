name: Screenshots

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            scripts/screenshots/pnpm-lock.yaml
      - name: Install ImageMagick and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
      - name: Capture and validate
        run: |
          chmod +x scripts/capture-screenshots.sh
          ./scripts/capture-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/screenshots
            screenshots/appstore
          if-no-files-found: error
